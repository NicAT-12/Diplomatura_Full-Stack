<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-100 to-slate-200 p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

        <h1 [ngStyle]="{ 'color': formulario.valid ? '#16a34a' : '#dd0031' }"
            class="text-2xl font-bold mb-2 transition-colors">
            Formulario de Registro
        </h1>
        <p class="text-slate-500 text-sm mb-6">
            Completá tus datos para registrarte. Todos los campos marcados como obligatorios deben completarse
            correctamente antes de poder enviar el formulario.
        </p>

        <form [formGroup]="formulario" (ngSubmit)="handleSubmit()" class="space-y-5">

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nombre</label>
                <input formControlName="nombre" [ngClass]="{ 'border-red-500 text-red-500': formulario.get('nombre')?.invalid && formulario.get('nombre')?.touched,
                       'border-slate-300': !(formulario.get('nombre')?.invalid && formulario.get('nombre')?.touched) }"
                    class="w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-[#dd0031]/40 transition" />
                <p *ngFor="let error of obtenerErrores('nombre')" class="text-red-500 text-xs mt-1">
                    {{ obtenerMensajeError(error) }}
                </p>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Mensaje</label>
                <textarea formControlName="mensaje" rows="3"
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-[#dd0031]/40 transition"></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input formControlName="email" [ngClass]="{ 'border-red-500 text-red-500': formulario.get('email')?.invalid && formulario.get('email')?.touched,
                       'border-slate-300': !(formulario.get('email')?.invalid && formulario.get('email')?.touched) }"
                    class="w-full border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-[#dd0031]/40 transition" />
                <p *ngFor="let error of obtenerErrores('email')" class="text-red-500 text-xs mt-1">
                    {{ obtenerMensajeError(error) }}
                </p>
            </div>

            <button type="submit" [disabled]="formulario.invalid" class="w-full bg-[#dd0031] text-white font-medium rounded-lg py-2.5
               hover:bg-[#c2002b] transition
               disabled:bg-slate-300 disabled:cursor-not-allowed">
                Enviar
            </button>

            <p *ngIf="enviado" class="text-green-600 text-sm text-center font-medium">
                ✅ Formulario enviado
            </p>

        </form>
    </div>
</div>
