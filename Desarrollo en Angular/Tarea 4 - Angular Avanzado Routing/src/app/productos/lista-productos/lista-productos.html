<h1 class="text-3xl font-bold">Productos</h1>
<p class="mt-2 text-tinta/80">Elegí un producto para ver su detalle.</p>

<div class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
  @for (p of productos; track p.id) {
    <a
      [routerLink]="['/productos', p.id]"
      class="block rounded-md border border-tinta/10 bg-white p-5 hover:border-marca"
    >
      <p class="text-sm text-marca">{{ p.categoria }}</p>
      <h2 class="mt-1 text-lg font-semibold">{{ p.nombre }}</h2>
      <p class="mt-2 text-sm text-tinta/70">{{ p.descripcion }}</p>
      <p class="mt-4 text-lg font-bold">{{ p.precio | currency: 'ARS' : 'symbol-narrow' : '1.0-0' }}</p>
    </a>
  }
</div>
