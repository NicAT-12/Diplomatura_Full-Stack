<article class="flex flex-col overflow-hidden rounded-lg bg-white shadow transition hover:-translate-y-1 hover:shadow-lg">
  <div class="relative flex h-64 items-center justify-center bg-cuero/10">
    @if (portada(); as url) {
      <img [src]="url" [alt]="'Portada de ' + libro().titulo" loading="lazy" class="h-full w-full object-cover" />
    } @else {
      <span class="px-4 text-center font-serif text-cuero">Sin portada</span>
    }
    <button
      type="button"
      (click)="favoritos.alternar(libro())"
      [attr.aria-label]="favoritos.esFavorito(libro().id) ? 'Quitar de favoritos' : 'Agregar a favoritos'"
      class="absolute right-2 top-2 rounded-full bg-white/90 px-2 py-1 text-xl shadow"
    >
      {{ favoritos.esFavorito(libro().id) ? '❤️' : '🤍' }}
    </button>
  </div>

  <div class="flex flex-1 flex-col gap-1 p-4">
    <h3 class="line-clamp-2 font-serif text-lg font-bold">{{ libro().titulo }}</h3>
    <p class="line-clamp-1 text-sm text-tinta/70">
      {{ libro().autores.length ? libro().autores.join(', ') : 'Autor desconocido' }}
    </p>
    @if (libro().anio) {
      <p class="text-sm text-tinta/60">Primera publicación: {{ libro().anio }}</p>
    }
    <a
      [routerLink]="['/libros', libro().id]"
      class="mt-auto inline-block rounded bg-cuero px-4 py-2 text-center text-papel transition hover:bg-cuero-oscuro"
    >
      Ver detalle
    </a>
  </div>
</article>
