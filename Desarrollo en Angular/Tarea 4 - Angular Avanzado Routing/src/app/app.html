<header class="border-b border-tinta/10 bg-white">
  <nav class="mx-auto flex max-w-5xl items-center gap-6 px-4 py-4" aria-label="Principal">
    <a routerLink="/" class="mr-auto text-lg font-bold text-marca">Granero Café</a>

    <a
      routerLink="/"
      routerLinkActive
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
      class="text-tinta/70 hover:text-tinta aria-[current=page]:font-semibold aria-[current=page]:text-marca"
      >Inicio</a
    >
    <a
      routerLink="/usuarios"
      routerLinkActive
      ariaCurrentWhenActive="page"
      class="text-tinta/70 hover:text-tinta aria-[current=page]:font-semibold aria-[current=page]:text-marca"
      >Usuarios</a
    >
    <a
      routerLink="/productos"
      routerLinkActive
      ariaCurrentWhenActive="page"
      class="text-tinta/70 hover:text-tinta aria-[current=page]:font-semibold aria-[current=page]:text-marca"
      >Productos</a
    >
  </nav>
</header>

<main class="mx-auto max-w-5xl px-4 py-10">
  <router-outlet />
</main>
